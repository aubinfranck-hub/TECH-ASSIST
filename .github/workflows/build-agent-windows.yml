name: Agent Windows (.exe)

# Se déclenche quand le code de l'agent change sur la branche de production, ou à la main.
# Le fichier est publié dans la release fixe « agent-latest » : le lien de téléchargement ne change jamais.
on:
  push:
    branches: [claude/ecstatic-maxwell-z0gk4g]
    paths: ['apps/agent/**', '.github/workflows/build-agent-windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --workspace apps/agent --include-workspace-root
      - name: Empaqueter en un seul fichier
        run: npx --yes esbuild@0.24.0 apps/agent/src/cli.ts --bundle --platform=node --format=cjs --target=node22 --outfile=agent.cjs
      - name: Fabriquer l'exécutable (Node SEA)
        shell: bash
        run: |
          echo '{"main":"agent.cjs","output":"sea.blob","disableExperimentalSEAWarning":true}' > sea-config.json
          node --experimental-sea-config sea-config.json
          node -e "require('fs').copyFileSync(process.execPath,'tech-assist-agent.exe')"
          npx --yes postject@1.0.0-alpha.6 tech-assist-agent.exe NODE_SEA_BLOB sea.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
      - name: Test de démarrage
        shell: bash
        run: ./tech-assist-agent.exe --skill inconnu || true
      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-latest
          target_commitish: ${{ github.sha }}
          name: Agent Windows (dernière version)
          files: tech-assist-agent.exe
          make_latest: true
