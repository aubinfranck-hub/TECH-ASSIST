name: TechAssist Android Technicien - essai sur émulateur

# Essai sur un VRAI Android (émulateur) : installation, service d'alerte, notification sonore, retrait quand un confrère prend la demande,
# console en WebView avec l'interface native, aucun plantage. Séparé de la fabrication : un émulateur capricieux ne bloque pas la publication.
on:
  push:
    branches: ["claude/ecstatic-maxwell-z0gk4g"]
    paths: ['apps/android-technicien/**', '.github/workflows/android-technicien-emulateur.yml']
  workflow_dispatch:

jobs:
  emulateur:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: APK d'essai (adresses du faux serveur, http autorisé)
        working-directory: apps/android-technicien
        run: gradle :app:assembleDebug --no-daemon -PapiUrl=http://10.0.2.2:8099 -PsiteUrl=http://10.0.2.2:8098 -PtestCleartext=true
      - name: Faux serveur
        run: |
          nohup node apps/android-technicien/ci/mock-server.mjs "$PWD/mock.log" > mock-out.txt 2>&1 &
          sleep 2
          cat mock.log
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Essai sur émulateur (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash apps/android-technicien/ci/emulator-test.sh
