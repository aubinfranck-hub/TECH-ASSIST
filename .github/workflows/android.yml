name: TechAssist Android
on:
  push:
    branches: ["claude/ecstatic-maxwell-z0gk4g"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: techassist-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
      # Téléchargement direct depuis le site : la dernière version de l'application Android est toujours à la même adresse.
      - name: Nom stable de l'APK
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk tech-assist-android.apk
        working-directory: .
      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          target_commitish: ${{ github.sha }}
          name: Application Android (dernière version)
          files: tech-assist-android.apk
